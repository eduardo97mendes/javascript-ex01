<!-- =========================================================
     ETAPA 01 - ESTRUTURA BÁSICA DO HTML
     =========================================================

     EXPLICAÇÃO:

     Todo documento HTML começa com uma estrutura básica.

     <!DOCTYPE html> informa ao navegador que estamos
     trabalhando com HTML5.

     A tag <html> envolve todo o conteúdo da página.

     OPÇÕES PARA lang:

     pt-BR = Português do Brasil
     en    = Inglês
     es    = Espanhol

     Complete:
-->

<!DOCTYPE html>

<html lang="___">

<head>

    <!--
        ETAPA 02 - META CHARSET

        O charset define a codificação dos caracteres.

        Para páginas em português, utilizaremos:

        UTF-8
        ASCII
        ISO-8859-1

        Complete:
    -->

    <meta charset="___">


    <!--
        ETAPA 03 - VIEWPORT

        O viewport ajuda a página a funcionar
        corretamente em celulares.

        Complete o valor:

        width=device-width, initial-scale=1.0
        width=screen, initial-scale=2
    -->

    <meta
        name="viewport"
        content="___"
    >


    <!--
        ETAPA 04 - TÍTULO

        A tag <title> define o título que aparece
        na aba do navegador.

        Complete com o nome do seu restaurante.
    -->

    <title>___</title>


    <!--
        ETAPA 05 - CSS EXTERNO

        A tag <link> permite conectar o arquivo
        CSS ao HTML.

        Atributos importantes:

        rel="stylesheet"
        href="style.css"

        Complete:
    -->

    <link
        rel="___"
        href="___"
    >

</head>


<body>

    <!-- =====================================================
         ETAPA 06 - CABEÇALHO
         =====================================================

         A tag <header> representa o cabeçalho
         da página.

         Dentro dele colocaremos:

         - logo
         - menu
         - botão
         - carrinho
    -->

    <header>

        <!--
            ETAPA 07 - TÍTULO / LOGO

            Podemos utilizar <h1> para o título
            principal da página.

            Complete:
        -->

        <h1>🍔 ___</h1>


        <!--
            ETAPA 08 - MENU

            A tag <nav> representa uma área
            de navegação.

            Os links utilizam a tag <a>.

            href="#inicio"

            faz o link levar até um elemento
            que tenha id="inicio".
        -->

        <nav>

            <a href="#inicio">Início</a>

            <a href="#cardapio">Cardápio</a>

            <a href="#sobre">Sobre</a>

            <a href="#contato">Contato</a>

        </nav>

    </header>


    <!-- =====================================================
         ETAPA 09 - CONTEÚDO PRINCIPAL
         =====================================================

         <main> representa o conteúdo principal
         da página.
    -->

    <main>


        <!-- =================================================
             ETAPA 10 - SEÇÃO
             =================================================

             A tag <section> divide a página
             em áreas de conteúdo.

             O atributo id permite criar um endereço
             para aquela seção.

             Exemplo:

             <section id="inicio">

        -->

        <section id="___" class="hero">

            <div>

                <!--
                    ETAPA 11 - TÍTULO

                    <h1> é utilizado para o título
                    principal.

                    Complete:
                -->

                <h1>
                    Seu hambúrguer,
                    <span>___</span>
                </h1>


                <!--
                    ETAPA 12 - PARÁGRAFO

                    A tag <p> representa um parágrafo.

                    Escreva uma frase para sua empresa.
                -->

                <p>
                    ___
                </p>


                <!--
                    ETAPA 13 - BOTÃO

                    A tag <button> cria um botão.

                    Mais tarde o JavaScript poderá
                    controlar esse botão.
                -->

                <button onclick="mostrarBoasVindas()">
                    ___
                </button>


                <!--
                    ETAPA 14 - ID

                    O id identifica um elemento.

                    O JavaScript poderá encontrar
                    este elemento através do id.

                    Complete:
                -->

                <p id="___"></p>

            </div>


            <div class="hero-imagem">

                🍔

            </div>

        </section>


        <!-- =================================================
             ETAPA 15 - CARDÁPIO
             =================================================

             Agora vamos criar uma seção com produtos.
        -->

        <section id="cardapio" class="secao">

            <h2>
                ___
            </h2>


            <!--
                ETAPA 16 - DIV

                <div> é um elemento utilizado para
                organizar o conteúdo.

                Aqui vamos utilizar uma div para
                agrupar os produtos.
            -->

            <div class="produtos">


                <!-- PRODUTO 01 -->

                <article class="produto">

                    <!--
                        <article> representa um conteúdo
                        independente.

                        Aqui representa um produto.
                    -->

                    <div class="produto-imagem">
                        🍔
                    </div>

                    <h3>Classic Burger</h3>

                    <p>
                        Pão, carne, queijo e molho especial.
                    </p>

                    <strong>
                        R$ 24,90
                    </strong>


                    <!--
                        ETAPA 17 - EVENTO

                        onclick executa uma função
                        JavaScript quando o botão
                        é clicado.

                        Neste caso:

                        adicionarProduto(24.90)

                        envia o preço para o JavaScript.
                    -->

                    <button onclick="adicionarProduto(24.90)">
                        Adicionar
                    </button>

                </article>


                <!--
                    PRÁTICA HTML 01

                    Crie o segundo produto.

                    Escolha:

                    nome:
                    Bacon Burger
                    Cheese Burger
                    Double Burger

                    preço:
                    25.90
                    29.90
                    34.90

                    Complete os campos marcados.
                -->

                <article class="produto">

                    <div class="produto-imagem">
                        🍔
                    </div>

                    <h3>___</h3>

                    <p>___</p>

                    <strong>
                        R$ ___
                    </strong>

                    <button onclick="adicionarProduto(___)">
                        Adicionar
                    </button>

                </article>


            </div>

        </section>


        <!-- =================================================
             ETAPA 18 - FORMULÁRIO
             ================================================= -->

        <section id="contato" class="contato">

            <h2>
                Fale conosco
            </h2>

            <!--
                <form> é utilizado para criar formulários.

                Dentro dele podemos utilizar:

                input
                textarea
                button
            -->

            <form onsubmit="enviarFormulario(event)">

                <!--
                    INPUT

                    type="text" recebe texto.

                    placeholder mostra uma dica
                    dentro do campo.
                -->

                <input
                    type="___"
                    id="nome"
                    placeholder="___"
                >


                <!--
                    PRÁTICA HTML 02

                    Crie um campo de e-mail.

                    OPÇÕES:

                    type="email"
                    type="text"
                    type="number"
                -->

                <input
                    type="___"
                    id="email"
                    placeholder="Seu e-mail"
                >


                <!--
                    TEXTAREA

                    Utilizado para textos maiores.
                -->

                <textarea
                    id="mensagemContato"
                    placeholder="Digite sua mensagem"
                ></textarea>


                <button type="submit">
                    Enviar
                </button>

            </form>


            <!--
                Este elemento será utilizado
                pelo JavaScript para mostrar
                uma resposta.
            -->

            <p id="resposta"></p>

        </section>

    </main>


    <!--
        ETAPA FINAL - JAVASCRIPT

        A tag <script> conecta o JavaScript
        ao HTML.

        Complete:
    -->

    <script src="___"></script>

</body>

</html>
